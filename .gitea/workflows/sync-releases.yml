name: Sync Releases to GitHub

on:
  release:
    types: [published, edited]

jobs:
  sync-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
      GH_REPO: OrangeApelsin/zappatv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch release details and assets from Gitea
        run: |
          mkdir -p release_assets
          curl -s -H "Authorization: token ${{ github.token }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            -o release.json

          jq -r '.body // ""' release.json > notes.md
          jq -r '.name // "${{ github.ref_name }}"' release.json > title.txt

          # Download any binary assets attached to the Gitea release
          for url in $(jq -r '.assets[].browser_download_url' release.json); do
            filename=$(basename "$url")
            curl -sL -H "Authorization: token ${{ github.token }}" "$url" -o "release_assets/$filename"
          done

      - name: Create or update GitHub Release
        run: |
          TAG="${{ github.ref_name }}"
          TITLE=$(cat title.txt)

          # Ensure the tag has been pushed to GitHub before creating the release
          sleep 5

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GH_REPO" --title "$TITLE" --notes-file notes.md
            if [ "$(ls -A release_assets)" ]; then
              gh release upload "$TAG" release_assets/* --repo "$GH_REPO" --clobber
            fi
          else
            if [ "$(ls -A release_assets)" ]; then
              gh release create "$TAG" release_assets/* --repo "$GH_REPO" --title "$TITLE" --notes-file notes.md
            else
              gh release create "$TAG" --repo "$GH_REPO" --title "$TITLE" --notes-file notes.md
            fi
          fi