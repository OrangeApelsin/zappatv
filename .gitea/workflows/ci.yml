    runs-on: ubuntu-latest
    container: node:22.23.4-bookworm
    timeout-minutes: 30
    steps:
      - name: Check out the exact source commit from Gitea
        env:
          CI_REPOSITORY_URL: ${{ gitea.server_url }}/${{ gitea.repository }}.git
          CI_COMMIT_SHA: ${{ gitea.event.pull_request.head.sha || gitea.sha }}
          CI_USERNAME: ${{ gitea.actor }}
          CI_TOKEN: ${{ gitea.token }}
        run: |
          set -eu
          if ! command -v git >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends git ca-certificates python3 curl
          fi
          export GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS="$(mktemp)"
          trap 'rm -f "$GIT_ASKPASS"' EXIT
          cat > "$GIT_ASKPASS" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *sername*) printf '%s\n' "$CI_USERNAME" ;;
            *assword*) printf '%s\n' "$CI_TOKEN" ;;
          esac
          ASKPASS
          chmod 700 "$GIT_ASKPASS"
          git init --quiet
          git remote add origin "$CI_REPOSITORY_URL"
          git fetch --no-tags --depth=1 origin "$CI_COMMIT_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"

      - name: Install isolated browser runtime
        run: sh scripts/tv/install-ci-browser-deps.sh

      - name: Install locked dependencies
        run: npm ci

      - name: Build deterministic unsigned candidates
        env:
          TIZEN_TARGETS: 5.0,5.5
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          mkdir -p build/candidate-evidence
          npm run package:all

      - name: Check the extracted WGT payload
        run: |
          export LD_LIBRARY_PATH="$PWD/build/tv-runtime/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          npm run tv:engines

      - name: Retain gate evidence (including failed engine results)
        if: always()
        uses: ./.gitea/actions/retain-artifacts
        with:
          name: engines-evidence-${{ gitea.event.pull_request.head.sha || gitea.sha }}

  gap:
    name: Gap parity
