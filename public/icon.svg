<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="Zappa TV">
  <defs>
    <clipPath id="squircle">
      <path d="M 256,0 C 51.2,0 0,51.2 0,256 C 0,460.8 51.2,512 256,512
               C 460.8,512 512,460.8 512,256 C 512,51.2 460.8,0 256,0 Z" />
    </clipPath>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e1a" />
      <stop offset="100%" stop-color="#06060e" />
    </linearGradient>
    <linearGradient id="zapGradientIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="50%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="glowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#iconBg)" />
    <g transform="translate(76, 116) scale(1.38)">
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="220" height="160" rx="40" fill="none" stroke="url(#zapGradientIcon)" stroke-width="12" filter="url(#glowIcon)" />
        <path d="M 125 25 L 75 90 L 110 90 L 85 145 L 145 75 L 110 75 Z" fill="url(#zapGradientIcon)" filter="url(#glowIcon)" />
      </g>
    </g>
  </g>
</svg>
