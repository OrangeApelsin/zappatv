<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" width="100%" height="100%">
  <defs>
    <!-- Vibrant Gradients for TV / Modern App feel -->
    <linearGradient id="zapGradientIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="50%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <filter id="glowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer TV Screen Outline & Lightning Bolt -->
  <g transform="translate(20, 20)">
    <!-- Outer TV Screen Outline / Frame -->
    <rect x="0" y="0" width="220" height="160" rx="40" fill="none" stroke="url(#zapGradientIcon)" stroke-width="12" filter="url(#glowIcon)" />
    
    <!-- Lightning Bolt / ZZap Icon -->
    <path d="M 125 25 L 75 90 L 110 90 L 85 145 L 145 75 L 110 75 Z" fill="url(#zapGradientIcon)" filter="url(#glowIcon)" />
  </g>
</svg>

